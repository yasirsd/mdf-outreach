name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + tests + build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholder values. Real Supabase secrets are NEVER put in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      APP_SESSION_SECRET: ci-secret-that-is-at-least-32-chars-long-for-tests
      NEXT_PUBLIC_MDF_STORAGE_MODE: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  security-audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Report residual advisories without failing the pipeline.
      # Anything that is not addressable on Next 14.2.x is documented in
      # docs/supabase-setup.md and the initial patch commit.
      - run: npm audit --production || true
